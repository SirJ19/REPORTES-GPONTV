<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPON TV • Reporte NOC</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        * {
            transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 150ms;
        }
        .channel-card { transition: all 0.2s ease; }
        .channel-card:hover { background-color: #1a1a1a; }
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333333;
            border-radius: 9999px;
            border: 2px solid #555555;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #22c55e;
            border-color: #22c55e;
        }
        input:checked + .slider:before {
            transform: translateX(22px);
        }
        .status-ok { background-color: #22c55e; color: #ffffff !important; font-weight: 700; }
        .status-problem { background-color: #ef4444; color: #ffffff; font-weight: 700; }
        .status-text { font-family: 'Inter', system-ui, sans-serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.5px; }
        .text-yes { color: #22c55e; font-weight: 700; }
        .text-no { color: #ef4444; font-weight: 700; letter-spacing: 1px; }
        body.light { background-color: #f8fafc; color: #0f172a; }
        body.light .bg-black { background-color: #ffffff !important; }
        body.light .bg-zinc-900 { background-color: #f1f5f9 !important; }
        body.light .bg-zinc-950 { background-color: #f8fafc !important; }
        body.light .border-zinc-800 { border-color: #e2e8f0 !important; }
        body.light .text-slate-200 { color: #0f172a !important; }
        body.light .text-white { color: #0f172a !important; }
        body.light .text-slate-400 { color: #64748b !important; }
        body.light .channel-card:hover { background-color: #f1f5f9 !important; }

        /* Timer de avería */
        .incident-timer {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.35);
            border-radius: 9999px;
            padding: 2px 10px;
            font-family: 'Space Grotesk', monospace;
            font-size: 0.72rem;
            font-weight: 600;
            color: #fca5a5;
            letter-spacing: 0.5px;
            white-space: nowrap;
            animation: pulse-border 2s ease-in-out infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(239,68,68,0.35); }
            50% { border-color: rgba(239,68,68,0.75); }
        }
        .incident-timer .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ef4444;
            animation: blink 1s step-start infinite;
            flex-shrink: 0;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        body.light .incident-timer {
            background: rgba(239,68,68,0.08);
            color: #b91c1c;
        }

        /* Loading overlay */
        #loading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; backdrop-filter: blur(4px);
        }
        #loading-overlay.hidden { display: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #333;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Botón limpiar búsqueda */
        .search-clear-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            color: #94a3b8;
            font-size: 0.85rem;
            cursor: pointer;
            background: transparent;
            border: none;
            line-height: 1;
        }
        .search-clear-btn:hover {
            background-color: rgba(148,163,184,0.15);
            color: #f97316;
        }
        .search-clear-btn.visible { display: flex; }
    </style>
</head>
<body class="bg-black text-slate-200 min-h-screen font-sans">

    <div id="loading-overlay">
        <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <span class="text-slate-400 text-sm">Cargando...</span>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-6 py-8">
        <!-- HEADER -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-orange-0 rounded-2xl flex items-center justify-center text-5xl">📺</div>
                <div>
                    <h1 class="text-3xl font-semibold tracking-tight text-orange-500" style="text-shadow: 0 0 10px rgba(249,115,22,0.35), 0 2px 12px rgba(249,115,22,0.18);">GPON TV</h1>
                    <p class="text-white text-sm">NOC REPORTE DE CANALES</p>
                </div>
            </div>
            
            <div id="current-datetime" class="font-mono text-lg text-slate-400 tracking-widest"></div>
            
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-8">
                    <div class="text-right">
                        <div class="text-xs text-slate-400">TOTAL</div>
                        <div id="total-channels" class="text-4xl font-semibold">0</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-400">INCIDENCIAS</div>
                        <div id="incidents-count" class="text-4xl font-semibold text-red-400">0</div>
                    </div>
                </div>
                <div class="flex flex-col items-stretch gap-1.5">
                    <button onclick="toggleForm()" id="toggle-form-btn"
                            class="flex items-center justify-center gap-2 px-5 py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded-3xl text-sm font-medium">
                        <span id="form-icon">▲</span>
                        <span id="form-text">Panel</span>
                    </button>
                    <button onclick="copyIncidentReport()" id="copy-report-btn"
                            class="flex items-center justify-center gap-1.5 py-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded-2xl text-xs font-medium text-slate-400">
                        <span id="copy-btn-icon">📋</span>
                        <span id="copy-btn-text">COPIAR</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- BOTÓN TEMA -->
        <button onclick="toggleTheme()" id="theme-toggle"
                class="fixed top-6 right-6 z-50 flex items-center justify-center w-12 h-12 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded-3xl text-2xl shadow-xl">
            🌙
        </button>

        <!-- FORMULARIO -->
        <div id="form-container" class="bg-black border border-zinc-800 rounded-3xl p-5 mb-7">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-3 text-white">➕ Agregar nuevo canal</h2>
            <div class="flex gap-4">
                <div class="w-28">
                    <label class="block text-xs font-medium text-slate-400 mb-1">NÚMERO</label>
                    <input id="channel-number" type="text" placeholder="7"
                           class="w-full bg-zinc-950 border border-zinc-800 focus:border-orange-400 rounded-2xl px-5 py-4 text-2xl font-mono font-bold outline-none text-center">
                </div>
                <div class="flex-1">
                    <label class="block text-xs font-medium text-slate-400 mb-1">NOMBRE DEL CANAL</label>
                    <input id="channel-name" type="text" placeholder="América TV"
                           class="w-full bg-zinc-950 border border-zinc-800 focus:border-orange-400 rounded-2xl px-5 py-4 text-lg outline-none">
                </div>
                <button onclick="addChannel()"
                        class="mt-6 bg-orange-500 hover:bg-orange-400 text-black font-bold px-8 py-4 rounded-3xl text-base shadow-lg">
                    AGREGAR
                </button>
            </div>
        </div>

        <!-- LISTADO -->
        <div class="flex justify-between items-center mb-5">
            <h2 id="view-title" class="text-2xl font-semibold text-white">Todos los canales</h2>
           
            <div class="flex items-center gap-3 flex-1 justify-end">
                <div class="relative w-64 md:w-77">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm">🔍</span>
                    <input
                        id="search-input"
                        type="text"
                        placeholder="Buscar canal..."
                        oninput="updateSearch(this.value)"
                        class="w-full bg-zinc-950 border border-zinc-800 focus:border-orange-400 rounded-3xl pl-12 pr-9 py-3 text-base outline-none"
                    >
                    <button
                        id="search-clear-btn"
                        type="button"
                        class="search-clear-btn"
                        onclick="clearSearch()"
                        aria-label="Limpiar búsqueda"
                        title="Limpiar búsqueda"
                    >✕</button>
                </div>
                <button onclick="toggleFilter()" id="filter-button"
                        class="flex items-center gap-3 px-5 py-2.5 bg-zinc-950 hover:bg-orange-500/10 border border-zinc-800 rounded-3xl text-sm font-medium shrink-0">
                    <span id="filter-icon">🔴</span>
                    <span id="filter-text">FILTRAR INCIDENCIAS</span>
                </button>
                <button onclick="resetAllStates()"
                        class="flex items-center gap-2 px-5 py-2.5 bg-zinc-950 hover:bg-emerald-500/10 hover:text-emerald-400 border border-zinc-800 rounded-3xl text-sm font-medium shrink-0">
                    🔄 REINICIAR ESTADO
                </button>
            </div>
        </div>


        <div id="channels-list" class="space-y-2"></div>
        <div id="empty-state" class="hidden text-center py-16">
            <div class="text-6xl mb-4">📺</div>
            <h3 id="empty-title" class="text-2xl font-medium text-white">No hay canales aún</h3>
            <p id="empty-subtitle" class="text-slate-400 mt-2">Agrega canales usando el formulario superior</p>
        </div>
    </div>

    <!-- BARRA INFERIOR -->
    <div class="fixed bottom-8 right-8 bg-black border border-zinc-800 rounded-3xl px-6 py-3 flex items-center gap-4 shadow-2xl">
        <div onclick="toggleFilter()" class="cursor-pointer flex items-center gap-3">
            <div id="footer-dot" class="w-3.5 h-3.5 bg-orange-500 rounded-full"></div>
            <span id="footer-text" class="font-medium text-sm">0 incidencias</span>
        </div>
        <div class="w-px h-4 bg-zinc-700"></div>
        <div class="flex items-center gap-1.5" title="Estado de sincronización en tiempo real">
            <div id="realtime-dot" class="w-2 h-2 rounded-full bg-yellow-400"></div>
            <span id="realtime-label" class="text-xs text-slate-500 font-mono tracking-wide">CONECTANDO…</span>
        </div>
        <div class="w-px h-4 bg-zinc-700"></div>
        <button onclick="exportData()" class="text-xs px-4 py-1.5 hover:bg-zinc-950 border border-zinc-800 rounded-2xl">
            Exportar CSV
        </button>
        <label class="text-xs px-4 py-1.5 hover:bg-zinc-950 border border-zinc-800 rounded-2xl cursor-pointer">
            Importar CSV
            <input type="file" id="import-file" accept=".csv" class="hidden" onchange="importCSV(this)">
        </label>
        <button onclick="deleteAllChannels()" class="text-xs px-4 py-1.5 hover:bg-red-500/10 hover:text-red-400 border border-zinc-800 rounded-2xl transition-colors">
            🗑 Limpiar
        </button>
    </div>

    <script>
    // ==================== SUPABASE CONFIG ====================
    const supabaseUrl = 'https://eongnockquilwrsbcfyl.supabase.co';
    const supabaseKey = 'sb_publishable_tPgHuR7fjTFhEEX-rHk8BQ_TD15xsIf';

    const sb = window.supabase.createClient(supabaseUrl, supabaseKey, {
        realtime: {
            params: {
                eventsPerSecond: 20
            }
        }
    });

    let channels = [];
    let filterOnlyIncidents = false;
    let formVisible = true;
    let isDarkMode = true;
    let searchQuery = '';
    let operationInProgress = false;
    let lastRenderedIds = '';

    // ==================== TIMER DE AVERÍA ====================
    const incidentStart = {};
    const LS_KEY = 'gpontv_incident_starts';

    function lsGetAll() {
        try {
            return JSON.parse(localStorage.getItem(LS_KEY) || '{}');
        } catch (error) {
            console.warn('No se pudo leer el temporizador local:', error);
            return {};
        }
    }

    function lsSaveAll(obj) {
        try {
            localStorage.setItem(LS_KEY, JSON.stringify(obj));
        } catch (error) {
            console.warn('No se pudo guardar el temporizador local:', error);
        }
    }

    function lsSetTimer(id, timestamp) {
        const obj = lsGetAll();
        obj[String(id)] = timestamp;
        lsSaveAll(obj);
    }

    function lsClearTimer(id) {
        const obj = lsGetAll();
        delete obj[String(id)];
        lsSaveAll(obj);
    }

    function lsClearAllTimers() {
        localStorage.removeItem(LS_KEY);
    }

    function formatDuration(seconds) {
        const safeSeconds = Math.max(0, Number(seconds) || 0);
        const totalMinutes = Math.floor(safeSeconds / 60);

        if (totalMinutes < 1) return '< 1m';

        if (safeSeconds < 3600) {
            return `${totalMinutes}m`;
        }

        if (safeSeconds < 86400) {
            const hours = Math.floor(safeSeconds / 3600);
            const minutes = Math.floor((safeSeconds % 3600) / 60);

            return minutes > 0
                ? `${hours}h ${minutes}m`
                : `${hours}h`;
        }

        const days = Math.floor(safeSeconds / 86400);
        const hours = Math.floor((safeSeconds % 86400) / 3600);

        return hours > 0
            ? `${days}d ${hours}h`
            : `${days}d`;
    }

    function tickTimers() {
        const now = Date.now();

        document.querySelectorAll('[data-timer-id]').forEach(element => {
            const id = String(element.dataset.timerId);
            const start = incidentStart[id];

            if (start) {
                element.textContent = formatDuration(
                    (now - start) / 1000
                );
            }
        });
    }

    function syncIncidentStart(channel) {
        const id = String(channel.id);

        if (hasProblem(channel)) {
            const stored = lsGetAll();

            if (stored[id]) {
                incidentStart[id] = Number(stored[id]);
            } else {
                const now = Date.now();

                incidentStart[id] = now;
                lsSetTimer(id, now);
            }
        } else {
            delete incidentStart[id];
            lsClearTimer(id);
        }
    }

    // ==================== ESTADO DE CARGA ====================
    function showLoading(show) {
        const overlay = document.getElementById('loading-overlay');

        if (overlay) {
            overlay.classList.toggle('hidden', !show);
        }
    }

    async function withLock(fn) {
        if (operationInProgress) return;

        operationInProgress = true;
        showLoading(true);

        try {
            return await fn();
        } catch (error) {
            console.error('Error inesperado:', error);

            alert(
                `Ocurrió un error inesperado:\n` +
                `${error.message || error}`
            );

            return null;
        } finally {
            operationInProgress = false;
            showLoading(false);
        }
    }

    // ==================== ACTUALIZACIONES DIFERIDAS ====================
    const pendingUpdates = {};

    function debouncedUpdate(id, fields, delayMs = 400) {
        const key = String(id);

        if (pendingUpdates[key]) {
            clearTimeout(pendingUpdates[key].timer);
            Object.assign(pendingUpdates[key].fields, fields);
        } else {
            pendingUpdates[key] = {
                fields: { ...fields },
                timer: null
            };
        }

        pendingUpdates[key].timer = setTimeout(async () => {
            const updateFields = pendingUpdates[key].fields;

            delete pendingUpdates[key];

            const success = await updateChannelInDB(
                id,
                updateFields
            );

            if (!success) {
                await loadChannels();

                lastRenderedIds = '';
                renderChannels();

                alert(
                    'No se pudo guardar el cambio. ' +
                    'Se restauró el estado de la base de datos.'
                );
            }
        }, delayMs);
    }

    // ==================== SUPABASE ====================
    async function loadChannels() {
        const { data, error } = await sb
            .from('GPONTV')
            .select('id, number, name, image, sound')
            .order('number', {
                ascending: true
            });

        if (error) {
            console.error('Load error:', error);

            alert(
                `No se pudieron cargar los canales:\n` +
                `${error.message}`
            );

            channels = [];
            return false;
        }

        channels = (data || []).map(row => ({
            id: row.id,
            number: row.number,
            name: row.name,
            image: row.image !== false,
            sound: row.sound !== false
        }));

        channels.forEach(syncIncidentStart);

        return true;
    }

    async function insertChannel(number, name) {
        const payload = {
            number: String(number).trim(),
            name: String(name).trim(),
            image: true,
            sound: true
        };

        /*
         * No se envía incident_since.
         * Así el registro funciona aunque esa columna no exista.
         */
        const { data, error } = await sb
            .from('GPONTV')
            .insert([payload])
            .select('id, number, name, image, sound')
            .single();

        if (error) {
            console.error('Insert error:', error);

            let message = error.message;

            if (error.code === '23505') {
                message =
                    `Ya existe un canal con el número ` +
                    `${payload.number}.`;
            } else if (error.code === '42501') {
                message =
                    'Supabase bloqueó el registro por las ' +
                    'políticas RLS de la tabla GPONTV.';
            }

            alert(
                `No se pudo agregar el canal:\n${message}`
            );

            return null;
        }

        return data;
    }

    async function updateChannelInDB(id, fields) {
        const { error } = await sb
            .from('GPONTV')
            .update(fields)
            .eq('id', id);

        if (error) {
            console.error('Update error:', error);
            return false;
        }

        return true;
    }

    async function deleteChannelFromDB(id) {
        const { error } = await sb
            .from('GPONTV')
            .delete()
            .eq('id', id);

        if (error) {
            console.error('Delete error:', error);

            alert(
                `No se pudo eliminar el canal:\n` +
                `${error.message}`
            );

            return false;
        }

        return true;
    }

    async function resetAllInDB() {
        if (channels.length === 0) return true;

        const ids = channels.map(channel => channel.id);

        const { error } = await sb
            .from('GPONTV')
            .update({
                image: true,
                sound: true
            })
            .in('id', ids);

        if (error) {
            console.error('Reset error:', error);

            alert(
                `No se pudieron reiniciar los canales:\n` +
                `${error.message}`
            );

            return false;
        }

        return true;
    }

    // ==================== REINICIAR ESTADOS ====================
    async function resetAllStates() {
        if (channels.length === 0) {
            alert('No hay canales para reiniciar.');
            return;
        }

        const accepted = confirm(
            '¿Reiniciar todos los estados?\n' +
            'Todos pasarán a ESTABLE ' +
            '(Imagen y Audio: SÍ)'
        );

        if (!accepted) return;

        await withLock(async () => {
            const success = await resetAllInDB();

            if (!success) return;

            channels.forEach(channel => {
                channel.image = true;
                channel.sound = true;
            });

            lsClearAllTimers();

            Object.keys(incidentStart).forEach(key => {
                delete incidentStart[key];
            });

            lastRenderedIds = '';
            renderChannels();
        });
    }

    // ==================== COPIAR REPORTE ====================
    function copyIncidentReport() {
        const problemChannels = channels.filter(
            channel => hasProblem(channel)
        );

        if (problemChannels.length === 0) {
            alert(
                'No hay incidencias activas para reportar.'
            );

            return;
        }

        const now = new Date(
            new Date().toLocaleString('en-US', {
                timeZone: 'America/Lima'
            })
        );

        const pad = value => {
            return String(value).padStart(2, '0');
        };

        const dateStr =
            `${pad(now.getDate())}/` +
            `${pad(now.getMonth() + 1)}/` +
            `${now.getFullYear()} ` +
            `${pad(now.getHours())}:` +
            `${pad(now.getMinutes())}`;

        const lines = [
            '🚨 REPORTE DE CANALES CON INCIDENCIAS 🚨',
            'LIMA / CUSCO / ICA',
            `Fecha: ${dateStr}`,
            `Incidencias detectadas: ${problemChannels.length}`,
            ''
        ];

        problemChannels.forEach(channel => {
            const issues = [];

            if (!channel.image) {
                issues.push('Sin Imagen');
            }

            if (!channel.sound) {
                issues.push('Sin Audio');
            }

            const start =
                incidentStart[String(channel.id)];

            const duration = start
                ? ` - ${formatDuration(
                    (Date.now() - start) / 1000
                )}`
                : '';

            lines.push(
                `CANAL ${channel.number} – ` +
                `${String(channel.name).toUpperCase()} ` +
                `(${issues.join(', ')})${duration}`
            );
        });

        const report = lines.join('\n');

        const markAsCopied = () => {
            const button =
                document.getElementById('copy-report-btn');

            const icon =
                document.getElementById('copy-btn-icon');

            const text =
                document.getElementById('copy-btn-text');

            if (icon) {
                icon.textContent = '✅';
            }

            if (text) {
                text.textContent = 'COPIADO';
            }

            if (button) {
                button.classList.add(
                    'border-green-500',
                    'text-green-400'
                );
            }

            setTimeout(() => {
                if (icon) {
                    icon.textContent = '📋';
                }

                if (text) {
                    text.textContent = 'COPIAR';
                }

                if (button) {
                    button.classList.remove(
                        'border-green-500',
                        'text-green-400'
                    );
                }
            }, 1500);
        };

        if (
            navigator.clipboard &&
            window.isSecureContext
        ) {
            navigator.clipboard
                .writeText(report)
                .then(markAsCopied)
                .catch(() => {
                    fallbackCopy(
                        report,
                        markAsCopied
                    );
                });
        } else {
            fallbackCopy(
                report,
                markAsCopied
            );
        }
    }

    function fallbackCopy(text, onSuccess) {
        const textarea =
            document.createElement('textarea');

        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.pointerEvents = 'none';

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        try {
            document.execCommand('copy');

            if (typeof onSuccess === 'function') {
                onSuccess();
            }
        } catch (error) {
            console.error('Copy error:', error);

            alert(
                'No se pudo copiar el reporte automáticamente.'
            );
        } finally {
            document.body.removeChild(textarea);
        }
    }

    // ==================== RENDER ====================
    function renderChannels() {
        sortChannels();

        const container =
            document.getElementById('channels-list');

        const empty =
            document.getElementById('empty-state');

        if (!container || !empty) return;

        let displayed = filterOnlyIncidents
            ? channels.filter(
                channel => hasProblem(channel)
            )
            : [...channels];

        if (searchQuery) {
            displayed = displayed.filter(channel => {
                const number =
                    String(channel.number).toLowerCase();

                const name =
                    String(channel.name).toLowerCase();

                return (
                    number.includes(searchQuery) ||
                    name.includes(searchQuery)
                );
            });
        }

        const incidentCount = channels.filter(
            channel => hasProblem(channel)
        ).length;

        setText(
            'total-channels',
            channels.length
        );

        setText(
            'incidents-count',
            incidentCount
        );

        setText(
            'footer-text',
            `${incidentCount} incidencias`
        );

        const footerDot =
            document.getElementById('footer-dot');

        if (footerDot) {
            footerDot.className =
                incidentCount > 0
                    ? (
                        'w-3.5 h-3.5 bg-red-500 ' +
                        'rounded-full animate-pulse'
                    )
                    : (
                        'w-3.5 h-3.5 bg-orange-500 ' +
                        'rounded-full'
                    );
        }

        setText(
            'view-title',
            filterOnlyIncidents
                ? (
                    `Canales con incidencias ` +
                    `(${displayed.length})`
                )
                : (
                    `Todos los canales ` +
                    `(${channels.length})`
                )
        );

        if (displayed.length === 0) {
            container.innerHTML = '';
            empty.classList.remove('hidden');

            setText(
                'empty-title',
                searchQuery
                    ? 'No se encontraron canales'
                    : filterOnlyIncidents
                        ? 'Sin incidencias activas'
                        : 'No hay canales aún'
            );

            setText(
                'empty-subtitle',
                searchQuery
                    ? 'Prueba con otro número o nombre'
                    : filterOnlyIncidents
                        ? (
                            'Todos los canales ' +
                            'están estables ✔'
                        )
                        : (
                            'Agrega canales usando ' +
                            'el formulario superior'
                        )
            );

            lastRenderedIds = '';
            return;
        }

        empty.classList.add('hidden');

        const idFingerprint = displayed
            .map(channel => {
                return (
                    `${channel.id}:` +
                    `${channel.number}:` +
                    `${channel.name}`
                );
            })
            .join('|');

        if (idFingerprint !== lastRenderedIds) {
            lastRenderedIds = idFingerprint;
            container.innerHTML = '';

            displayed.forEach(channel => {
                container.appendChild(
                    buildCard(channel)
                );
            });
        } else {
            displayed.forEach(channel => {
                const existingCard = findCardById(
                    container,
                    channel.id
                );

                if (existingCard) {
                    updateCardInPlace(
                        existingCard,
                        channel
                    );
                }
            });
        }
    }

    // ==================== AGREGAR CANAL ====================
    async function addChannel() {
        const numberInput =
            document.getElementById(
                'channel-number'
            );

        const nameInput =
            document.getElementById(
                'channel-name'
            );

        const number = String(
            numberInput?.value || ''
        ).trim();

        const name = String(
            nameInput?.value || ''
        ).trim();

        if (!number || !name) {
            alert(
                'Por favor ingresa el número ' +
                'y el nombre del canal.'
            );

            return;
        }

        const localDuplicate =
            channels.find(channel => {
                return (
                    String(channel.number)
                        .trim()
                        .toLowerCase() ===
                    number.toLowerCase()
                );
            });

        if (localDuplicate) {
            showAllChannels();
            renderChannels();

            alert(
                `El canal ${number} ya está ` +
                `registrado como ` +
                `“${localDuplicate.name}”.`
            );

            return;
        }

        await withLock(async () => {
            const {
                data: existing,
                error: checkError
            } = await sb
                .from('GPONTV')
                .select('id, number, name')
                .eq('number', number)
                .limit(1);

            if (checkError) {
                console.error(
                    'Duplicate check error:',
                    checkError
                );

                alert(
                    `No se pudo verificar el número ` +
                    `del canal:\n${checkError.message}`
                );

                return;
            }

            if (
                existing &&
                existing.length > 0
            ) {
                showAllChannels();
                renderChannels();

                alert(
                    `El canal ${number} ya existe ` +
                    `en la base de datos.`
                );

                return;
            }

            const newChannel =
                await insertChannel(
                    number,
                    name
                );

            if (!newChannel) return;

            channels.push({
                id: newChannel.id,
                number: newChannel.number,
                name: newChannel.name,
                image:
                    newChannel.image !== false,
                sound:
                    newChannel.sound !== false
            });

            if (numberInput) {
                numberInput.value = '';
            }

            if (nameInput) {
                nameInput.value = '';
            }

            /*
             * El canal nuevo nace estable.
             * Por eso mostramos todos los canales
             * después de agregarlo.
             */
            showAllChannels();

            lastRenderedIds = '';
            renderChannels();

            if (numberInput) {
                numberInput.focus();
            }
        });
    }

    // ==================== CSV ====================
    function csvEscape(value) {
        const text = String(value ?? '');

        return /[",\n\r]/.test(text)
            ? `"${text.replaceAll('"', '""')}"`
            : text;
    }

    function parseCSVLine(line) {
        const result = [];

        let current = '';
        let insideQuotes = false;

        for (
            let i = 0;
            i < line.length;
            i++
        ) {
            const char = line[i];
            const next = line[i + 1];

            if (
                char === '"' &&
                insideQuotes &&
                next === '"'
            ) {
                current += '"';
                i++;
            } else if (char === '"') {
                insideQuotes = !insideQuotes;
            } else if (
                char === ',' &&
                !insideQuotes
            ) {
                result.push(current.trim());
                current = '';
            } else {
                current += char;
            }
        }

        result.push(current.trim());

        return result;
    }

                });

    }

    function exportData() {
        if (channels.length === 0) {
            alert(
                'No hay datos para exportar.'
            );

            return;
        }

        const rows = [
            [
                'Número',
                'Nombre',
                'Imagen',
                'Audio',
                'Estado',
                'Tiempo_Avería'
            ]
        ];

        channels.forEach(channel => {
            const start =
                incidentStart[
                    String(channel.id)
                ];

            const incidentTime = start
                ? formatDuration(
                    (Date.now() - start) / 1000
                )
                : '';

            rows.push([
                channel.number,
                channel.name,
                channel.image ? 'SÍ' : 'NO',
                channel.sound ? 'SÍ' : 'NO',
                hasProblem(channel)
                    ? 'INCIDENCIA'
                    : 'ESTABLE',
                incidentTime
            ]);
        });

        const csv = rows
            .map(row => {
                return row
                    .map(csvEscape)
                    .join(',');
            })
            .join('\n');

        const blob = new Blob(
            ['\uFEFF', csv],
            {
                type: 'text/csv;charset=utf-8'
            }
        );

        const url =
            URL.createObjectURL(blob);

        const link =
            document.createElement('a');

        link.href = url;

        link.download =
            `gpon_tv_` +
            `${new Date()
                .toISOString()
                .slice(0, 10)
            }.csv`;

        document.body.appendChild(link);

        link.click();
        link.remove();

        URL.revokeObjectURL(url);
    }

    function importCSV(input) {
        const file = input.files?.[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = async event => {
            const text = String(
                event.target?.result || ''
            )
                .replace(/^\uFEFF/, '')
                .trim();

            if (!text) {
                alert(
                    'El archivo CSV está vacío.'
                );

                input.value = '';
                return;
            }

            const lines =
                text.split(/\r?\n/);

            const imported = [];
            const seenNumbers = new Set();

            for (
                let i = 1;
                i < lines.length;
                i++
            ) {
                if (!lines[i].trim()) {
                    continue;
                }

                const [
                    number,
                    name,
                    image,
                    sound
                ] = parseCSVLine(lines[i]);

                const normalizedNumber =
                    String(number || '').trim();

                const normalizedName =
                    String(name || '').trim();

                if (
                    !normalizedNumber ||
                    !normalizedName
                ) {
                    continue;
                }

                if (
                    seenNumbers.has(
                        normalizedNumber
                            .toLowerCase()
                    )
                ) {
                    continue;
                }

                seenNumbers.add(
                    normalizedNumber
                        .toLowerCase()
                );

                imported.push({
                    number: normalizedNumber,
                    name: normalizedName,

                    image:
                        String(image || '')
                            .toUpperCase() !== 'NO',

                    sound:
                        String(sound || '')
                            .toUpperCase() !== 'NO'
                });
            }

            if (imported.length === 0) {
                alert(
                    'No se encontraron canales ' +
                    'válidos en el CSV.'
                );

                input.value = '';
                return;
            }

            if (
                channels.length > 0 &&
                !confirm(
                    `¿Reemplazar los ` +
                    `${channels.length} canales ` +
                    `actuales con ` +
                    `${imported.length} del CSV?`
                )
            ) {
                input.value = '';
                return;
            }

            await withLock(async () => {
                if (channels.length > 0) {
                    const ids = channels.map(
                        channel => channel.id
                    );

                    const {
                        error: deleteError
                    } = await sb
                        .from('GPONTV')
                        .delete()
                        .in('id', ids);

                    if (deleteError) {
                        console.error(
                            'Import delete error:',
                            deleteError
                        );

                        alert(
                            `No se pudieron eliminar ` +
                            `los canales actuales:\n` +
                            `${deleteError.message}`
                        );

                        return;
                    }
                }

                const {
                    data,
                    error: insertError
                } = await sb
                    .from('GPONTV')
                    .insert(imported)
                    .select(
                        'id, number, name, ' +
                        'image, sound'
                    );

                if (insertError) {
                    console.error(
                        'Import insert error:',
                        insertError
                    );

                    alert(
                        `No se pudo importar el CSV:\n` +
                        `${insertError.message}`
                    );

                    await loadChannels();

                    lastRenderedIds = '';
                    renderChannels();

                    return;
                }

                channels = (data || []).map(
                    row => ({
                        id: row.id,
                        number: row.number,
                        name: row.name,

                        image:
                            row.image !== false,

                        sound:
                            row.sound !== false
                    })
                );

                lsClearAllTimers();

                Object
                    .keys(incidentStart)
                    .forEach(key => {
                        delete incidentStart[key];
                    });

                channels.forEach(
                    syncIncidentStart
                );

                showAllChannels();

                lastRenderedIds = '';
                renderChannels();

                alert(
                    `Se importaron ` +
                    `${channels.length} canales.`
                );
            });

            input.value = '';
        };

        reader.onerror = () => {
            alert(
                'No se pudo leer el archivo CSV.'
            );

            input.value = '';
        };

        reader.readAsText(
            file,
            'UTF-8'
        );
    }

    // ==================== REALTIME ====================
    let realtimeChannel = null;
    let realtimeRetryTimer = null;

    function setRealtimeStatus(status) {
        const dot =
            document.getElementById(
                'realtime-dot'
            );

        const label =
            document.getElementById(
                'realtime-label'
            );

        if (!dot || !label) return;

        const states = {
            connected: {
                className: 'bg-green-500',
                text: 'ONLINE'
            },

            disconnected: {
                className: 'bg-red-500',
                text: 'SIN CONEXIÓN'
            },

            reconnecting: {
                className: 'bg-yellow-400',
                text: 'RECONECTANDO…'
            }
        };

        const state =
            states[status] ||
            states.disconnected;

        dot.className =
            `w-2 h-2 rounded-full ` +
            `${state.className} ` +
            `${status === 'connected'
                ? 'animate-pulse'
                : ''
            }`;

        label.textContent = state.text;
    }

    function setupRealtime() {
        if (realtimeChannel) {
            sb.removeChannel(
                realtimeChannel
            );

            realtimeChannel = null;
        }

        clearTimeout(
            realtimeRetryTimer
        );

        setRealtimeStatus(
            'reconnecting'
        );

        realtimeChannel =
            sb.channel('gpontv-live');

        realtimeChannel
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'GPONTV'
                },
                payload => {
                    if (
                        payload.eventType ===
                        'INSERT'
                    ) {
                        const row = payload.new;

                        const alreadyExists =
                            channels.some(
                                channel => {
                                    return (
                                        String(
                                            channel.id
                                        ) ===
                                        String(
                                            row.id
                                        )
                                    );
                                }
                            );

                        if (!alreadyExists) {
                            const channel = {
                                id: row.id,
                                number: row.number,
                                name: row.name,

                                image:
                                    row.image !== false,

                                sound:
                                    row.sound !== false
                            };

                            channels.push(channel);

                            syncIncidentStart(
                                channel
                            );

                            lastRenderedIds = '';
                            renderChannels();
                        }
                    }

                    if (
                        payload.eventType ===
                        'UPDATE'
                    ) {
                        const row = payload.new;

                        const channel =
                            channels.find(
                                item => {
                                    return (
                                        String(
                                            item.id
                                        ) ===
                                        String(
                                            row.id
                                        )
                                    );
                                }
                            );

                        if (channel) {
                            channel.number =
                                row.number;

                            channel.name =
                                row.name;

                            channel.image =
                                row.image !== false;

                            channel.sound =
                                row.sound !== false;

                            syncIncidentStart(
                                channel
                            );

                            renderChannels();
                        }
                    }

                    if (
                        payload.eventType ===
                        'DELETE'
                    ) {
                        const id =
                            payload.old.id;

                        channels =
                            channels.filter(
                                channel => {
                                    return (
                                        String(
                                            channel.id
                                        ) !==
                                        String(id)
                                    );
                                }
                            );

                        delete incidentStart[
                            String(id)
                        ];

                        lsClearTimer(id);

                        lastRenderedIds = '';
                        renderChannels();
                    }
                }
            )
            .subscribe(status => {
                if (
                    status ===
                    'SUBSCRIBED'
                ) {
                    setRealtimeStatus(
                        'connected'
                    );

                    clearTimeout(
                        realtimeRetryTimer
                    );

                    return;
                }

                if (
                    status ===
                        'CHANNEL_ERROR' ||
                    status ===
                        'TIMED_OUT' ||
                    status ===
                        'CLOSED'
                ) {
                    setRealtimeStatus(
                        'disconnected'
                    );

                    realtimeRetryTimer =
                        setTimeout(
                            setupRealtime,
                            5000
                        );
                }
            });
    }

    // ==================== INIT ====================
    window.addEventListener(
        'load',
        async () => {
            const savedTheme =
                localStorage.getItem(
                    'theme'
                );

            isDarkMode =
                savedTheme !== 'light';

            document.body.classList.toggle(
                'light',
                !isDarkMode
            );

            updateThemeButton();

            const savedForm =
                localStorage.getItem(
                    'formVisible'
                );

            formVisible =
                savedForm !== 'false';

            const formContainer =
                document.getElementById(
                    'form-container'
                );

            const formIcon =
                document.getElementById(
                    'form-icon'
                );

            if (formContainer) {
                formContainer.style.display =
                    formVisible
                        ? 'block'
                        : 'none';
            }

            if (formIcon) {
                formIcon.textContent =
                    formVisible
                        ? '▲'
                        : '▼';
            }

            showLoading(true);

            await loadChannels();

            showLoading(false);

            /*
             * La página inicia mostrando todos
             * los canales. Así los canales nuevos
             * no quedan ocultos.
             */
            filterOnlyIncidents = false;

            updateFilterButton();

            lastRenderedIds = '';
            renderChannels();

            setupRealtime();
            updateDateTime();

            setInterval(
                updateDateTime,
                1000
            );

            setInterval(
                tickTimers,
                1000
            );

            const numberInput =
                document.getElementById(
                    'channel-number'
                );

            const nameInput =
                document.getElementById(
                    'channel-name'
                );

            [
                numberInput,
                nameInput
            ].forEach(input => {
                if (!input) return;

                input.addEventListener(
                    'keydown',
                    event => {
                        if (
                            event.key ===
                            'Enter'
                        ) {
                            event.preventDefault();
                            addChannel();
                        }
                    }
                );
            });
        }
    );
</script>
</body>
