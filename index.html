<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPON TV • Reporte NOC</title>
    <link rel="icon" type="image/png" href="./favicon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');

        * {
            transition-property: color, background-color, border-color, opacity, transform;
            transition-duration: 150ms;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        .channel-card {
            transition: background-color .2s ease, border-color .2s ease;
        }

        .channel-card:hover {
            background-color: #171717;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #333;
            border-radius: 9999px;
            border: 2px solid #555;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 2px;
            background-color: white;
            border-radius: 50%;
            transition: transform .15s ease;
        }

        input:checked + .slider {
            background-color: #22c55e;
            border-color: #22c55e;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        .status-ok {
            background-color: #22c55e;
            color: #fff;
            font-weight: 700;
        }

        .status-problem {
            background-color: #ef4444;
            color: #fff;
            font-weight: 700;
        }

        .status-text {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: .5px;
        }

        .text-yes {
            color: #22c55e;
            font-weight: 700;
        }

        .text-no {
            color: #ef4444;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .incident-timer {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(239,68,68,.15);
            border: 1px solid rgba(239,68,68,.38);
            border-radius: 9999px;
            padding: 3px 10px;
            font-family: 'Space Grotesk', monospace;
            font-size: .72rem;
            font-weight: 600;
            color: #fca5a5;
            white-space: nowrap;
        }

        .incident-timer .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ef4444;
            animation: blink 1s step-start infinite;
        }

        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: .2; }
        }

        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.68);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }

        #loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-clear-btn {
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            display: none;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            color: #94a3b8;
            font-size: .82rem;
        }

        .search-clear-btn.visible {
            display: flex;
        }

        .search-clear-btn:hover {
            background: rgba(148,163,184,.15);
            color: #f97316;
        }

        @media (max-width: 980px) {
            .channel-row {
                flex-direction: column;
                align-items: stretch !important;
            }

            .channel-controls {
                justify-content: space-between;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body class="bg-black text-slate-200 min-h-screen">

    <div id="loading-overlay">
        <div class="flex flex-col items-center gap-4">
            <div class="spinner"></div>
            <span class="text-slate-400 text-sm">Cargando...</span>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-6 py-8">
        <div class="flex items-center justify-between mb-6 gap-5">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 flex items-center justify-center text-5xl">📺</div>
                <div>
                    <h1 class="text-3xl font-semibold tracking-tight text-orange-500"
                        style="text-shadow:0 0 10px rgba(249,115,22,.35),0 2px 12px rgba(249,115,22,.18);">
                        GPON TV
                    </h1>
                    <p class="text-white text-sm">NOC REPORTE DE CANALES</p>
                </div>
            </div>

            <div id="current-datetime"
                 class="font-mono text-lg text-slate-400 tracking-widest hidden md:block"></div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-7">
                    <div class="text-right">
                        <div class="text-xs text-slate-400">TOTAL</div>
                        <div id="total-channels" class="text-4xl font-semibold">0</div>
                    </div>

                    <div class="text-right">
                        <div class="text-xs text-slate-400">INCIDENCIAS</div>
                        <div id="incidents-count"
                             class="text-4xl font-semibold text-red-400">0</div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button onclick="togglePanel()" id="toggle-form-btn"
                            class="w-32 flex items-center justify-center gap-2 px-4 py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded-3xl text-sm font-medium">
                        <span id="form-icon">▼</span>
                        <span>PANEL</span>
                    </button>

                    <button onclick="copyIncidentReport()" id="copy-report-btn"
                            class="w-28 flex items-center justify-center gap-2 px-4 py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 rounded-3xl text-sm font-medium">
                        <span id="copy-btn-icon">📋</span>
                        <span id="copy-btn-text">COPIAR</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="form-container"
             class="bg-black border border-zinc-800 rounded-3xl p-5 mb-7"
             style="display:none;">
            <h2 class="text-lg font-semibold mb-4 text-white">➕ Agregar nuevo canal</h2>

            <div class="flex gap-4">
                <div class="w-28">
                    <label class="block text-xs font-medium text-slate-400 mb-1">NÚMERO</label>
                    <input id="channel-number" type="text" placeholder="7"
                           class="w-full bg-zinc-950 border border-zinc-800 focus:border-orange-400 rounded-2xl px-5 py-4 text-2xl font-mono font-bold outline-none text-center">
                </div>

                <div class="flex-1">
                    <label class="block text-xs font-medium text-slate-400 mb-1">NOMBRE DEL CANAL</label>
                    <input id="channel-name" type="text" placeholder="América TV"
                           class="w-full bg-zinc-950 border border-zinc-800 focus:border-orange-400 rounded-2xl px-5 py-4 text-lg outline-none">
                </div>

                <button onclick="addChannel()"
                        class="mt-6 bg-orange-500 hover:bg-orange-400 text-black font-bold px-8 py-4 rounded-3xl">
                    AGREGAR
                </button>
            </div>
        </div>

        <div class="flex justify-between items-center mb-5 gap-4">
            <h2 id="view-title" class="text-2xl font-semibold text-white">
                Todos los canales
            </h2>

            <div class="flex items-center gap-3 flex-1 justify-end">
                <div class="relative w-64">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm">🔍</span>
                    <input id="search-input"
                           type="text"
                           placeholder="Buscar canal..."
                           oninput="updateSearch(this.value)"
                           class="w-full bg-zinc-950 border border-zinc-800 focus:border-orange-400 rounded-3xl pl-12 pr-9 py-3 text-base outline-none">

                    <button id="search-clear-btn"
                            type="button"
                            class="search-clear-btn"
                            onclick="clearSearch()"
                            title="Limpiar búsqueda">
                        ✕
                    </button>
                </div>

                <button onclick="toggleFilter()" id="filter-button"
                        class="flex items-center gap-3 px-5 py-2.5 bg-zinc-950 hover:bg-orange-500/10 border border-zinc-800 rounded-3xl text-sm font-medium shrink-0">
                    <span id="filter-icon">🔴</span>
                    <span id="filter-text">FILTRAR INCIDENCIAS</span>
                </button>

                <button onclick="resetAllStates()"
                        class="flex items-center gap-2 px-5 py-2.5 bg-zinc-950 hover:bg-emerald-500/10 hover:text-emerald-400 border border-zinc-800 rounded-3xl text-sm font-medium shrink-0">
                    🔄 REINICIAR ESTADO
                </button>
            </div>
        </div>

        <div id="channels-list" class="space-y-2"></div>

        <div id="empty-state" class="hidden text-center py-16">
            <div class="text-6xl mb-4">📺</div>
            <h3 id="empty-title" class="text-2xl font-medium text-white">
                No hay canales aún
            </h3>
            <p id="empty-subtitle" class="text-slate-400 mt-2">
                Agrega canales usando el panel superior
            </p>
        </div>
    </div>

    <div class="fixed bottom-8 right-8 bg-black border border-zinc-800 rounded-3xl px-6 py-3 flex items-center gap-4 shadow-2xl">
        <div onclick="toggleFilter()" class="cursor-pointer flex items-center gap-3">
            <div id="footer-dot" class="w-3.5 h-3.5 bg-orange-500 rounded-full"></div>
            <span id="footer-text" class="font-medium text-sm">0 incidencias</span>
        </div>

        <div class="w-px h-4 bg-zinc-700"></div>

        <div class="flex items-center gap-1.5" title="Estado en tiempo real">
            <div id="realtime-dot" class="w-2 h-2 rounded-full bg-yellow-400"></div>
            <span id="realtime-label"
                  class="text-xs text-slate-500 font-mono tracking-wide">
                CONECTANDO…
            </span>
        </div>

        <div class="w-px h-4 bg-zinc-700"></div>

        <button onclick="exportData()"
                class="text-xs px-4 py-1.5 hover:bg-zinc-950 border border-zinc-800 rounded-2xl">
            Exportar CSV
        </button>

        <label class="text-xs px-4 py-1.5 hover:bg-zinc-950 border border-zinc-800 rounded-2xl cursor-pointer">
            Importar CSV
            <input type="file"
                   id="import-file"
                   accept=".csv"
                   class="hidden"
                   onchange="importCSV(this)">
        </label>
    </div>

<script>
    // ==================== SUPABASE ====================
    // Esta web usa únicamente la base de datos del monitor.
    // No contiene ni consulta ninguna fuente externa de canales.
    const supabaseUrl = 'https://eongnockquilwrsbcfyl.supabase.co';
    const supabaseKey = 'sb_publishable_tPgHuR7fjTFhEEX-rHk8BQ_TD15xsIf';

    const sb = window.supabase.createClient(supabaseUrl, supabaseKey, {
        realtime: {
            params: {
                eventsPerSecond: 20
            }
        }
    });

    const CHANNEL_SELECT =
        'id, number, name, image, sound, incident_open, incident_since, incident_origin';


    let channels = [];
    let filterOnlyIncidents = false;
    let panelOpen = false;
    let searchQuery = '';
    let operationInProgress = false;
    let realtimeChannel = null;

    function escapeHTML(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function mapRowToChannel(row) {
        return {
            id: row.id,
            number: row.number ?? '',
            name: row.name ?? '',
            image: row.image !== false,
            sound: row.sound !== false,
            incident_open: row.incident_open === true,
            incident_since: row.incident_since || null,
            incident_origin: row.incident_origin || null
        };
    }

    function hasProblem(channel) {
        return !channel.image || !channel.sound;
    }

    function sortChannels() {
        channels.sort((a, b) => {
            const na = Number(a.number);
            const nb = Number(b.number);

            if (Number.isFinite(na) && Number.isFinite(nb) && na !== nb) {
                return na - nb;
            }

            return String(a.number).localeCompare(
                String(b.number),
                'es',
                { numeric: true }
            );
        });
    }

    function setText(id, value) {
        const node = document.getElementById(id);
        if (node) node.textContent = value;
    }

    function nowLima() {
        return new Date(
            new Date().toLocaleString(
                'en-US',
                { timeZone: 'America/Lima' }
            )
        );
    }

    function updateClock() {
        const now = nowLima();
        const pad = value => String(value).padStart(2, '0');

        setText(
            'current-datetime',
            `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ` +
            `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`
        );
    }

    function formatDurationFromMs(milliseconds) {
        const totalMinutes = Math.max(
            0,
            Math.floor(milliseconds / 60000)
        );

        const days = Math.floor(totalMinutes / 1440);
        const hours = Math.floor((totalMinutes % 1440) / 60);
        const minutes = totalMinutes % 60;

        const parts = [];

        if (days > 0) parts.push(`${days}d`);
        if (hours > 0) parts.push(`${hours}h`);

        if (days === 0 && hours === 0) {
            parts.push(`${minutes}m`);
        } else if (days === 0 && minutes > 0) {
            parts.push(`${minutes}m`);
        }

        return parts.join(' ');
    }

    function incidentDuration(channel) {
        if (!hasProblem(channel) || !channel.incident_since) {
            return '';
        }

        const start = new Date(channel.incident_since).getTime();
        if (!Number.isFinite(start)) return '';

        return formatDurationFromMs(Date.now() - start);
    }

    function buildTimerHTML(channel) {
        const duration = incidentDuration(channel);
        if (!duration) return '';

        return `
            <span class="incident-timer"
                  data-timer-id="${escapeHTML(channel.id)}">
                <span class="dot"></span>
                ${escapeHTML(duration)}
            </span>
        `;
    }

    async function loadChannels() {
        const { data, error } = await sb
            .from('GPONTV')
            .select(CHANNEL_SELECT)
            .order('number', { ascending: true });

        if (error) throw error;

        channels = (data || []).map(mapRowToChannel);
        sortChannels();
    }

    async function updateChannelInDB(id, fields) {
        const { error } = await sb
            .from('GPONTV')
            .update(fields)
            .eq('id', id);

        if (error) {
            console.error(error);
            return false;
        }

        return true;
    }

    function renderChannels() {
        sortChannels();

        const container = document.getElementById('channels-list');
        const empty = document.getElementById('empty-state');

        let displayed = filterOnlyIncidents
            ? channels.filter(hasProblem)
            : [...channels];

        if (searchQuery) {
            displayed = displayed.filter(channel => {
                const number = String(channel.number).toLowerCase();
                const name = String(channel.name).toLowerCase();

                return (
                    number.includes(searchQuery) ||
                    name.includes(searchQuery)
                );
            });
        }

        const incidentCount = channels.filter(hasProblem).length;

        setText('total-channels', channels.length);
        setText('incidents-count', incidentCount);
        setText('footer-text', `${incidentCount} incidencias`);

        const footerDot = document.getElementById('footer-dot');
        if (footerDot) {
            footerDot.className =
                incidentCount > 0
                    ? 'w-3.5 h-3.5 bg-red-500 rounded-full animate-pulse'
                    : 'w-3.5 h-3.5 bg-orange-500 rounded-full';
        }

        setText(
            'view-title',
            filterOnlyIncidents
                ? `Canales con incidencias (${displayed.length})`
                : `Todos los canales (${channels.length})`
        );

        updateFilterButton();

        if (!displayed.length) {
            container.innerHTML = '';
            empty.classList.remove('hidden');

            setText(
                'empty-title',
                searchQuery
                    ? 'No se encontraron canales'
                    : filterOnlyIncidents
                        ? 'Sin incidencias activas'
                        : 'No hay canales aún'
            );

            setText(
                'empty-subtitle',
                searchQuery
                    ? 'Prueba con otro número o nombre'
                    : filterOnlyIncidents
                        ? 'Todos los canales están estables ✔'
                        : 'Agrega canales usando el panel superior'
            );

            return;
        }

        empty.classList.add('hidden');
        container.innerHTML = '';

        displayed.forEach(channel => {
            container.appendChild(buildCard(channel));
        });
    }

    function buildCard(channel) {
        const incident = hasProblem(channel);
        const idArg = JSON.stringify(channel.id);

        const card = document.createElement('div');
        card.className =
            `channel-card bg-black border ` +
            `${incident ? 'border-red-500' : 'border-zinc-800'} ` +
            `rounded-3xl px-6 py-4`;

        card.innerHTML = `
            <div class="channel-row flex items-center justify-between gap-5">
                <div class="flex items-center gap-6 min-w-0">
                    <div class="w-14 text-center shrink-0">
                        <div class="text-3xl font-mono font-bold text-orange-400">
                            ${escapeHTML(channel.number)}
                        </div>
                    </div>

                    <div class="min-w-0">
                        <div class="text-xl font-semibold truncate">
                            ${escapeHTML(channel.name)}
                        </div>
                    </div>
                </div>

                <div class="channel-controls flex items-center gap-6 shrink-0">
                    <div class="flex items-center gap-2">
                        <span class="text-white font-medium text-xs">IMAGEN</span>
                        <span class="status-text ${channel.image ? 'text-yes' : 'text-no'}">
                            ${channel.image ? 'SÍ' : 'NO'}
                        </span>

                        <label class="switch">
                            <input type="checkbox"
                                   ${channel.image ? 'checked' : ''}
                                   onchange='updateImage(${idArg}, this.checked)'>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="text-white font-medium text-xs">AUDIO</span>
                        <span class="status-text ${channel.sound ? 'text-yes' : 'text-no'}">
                            ${channel.sound ? 'SÍ' : 'NO'}
                        </span>

                        <label class="switch">
                            <input type="checkbox"
                                   ${channel.sound ? 'checked' : ''}
                                   onchange='updateSound(${idArg}, this.checked)'>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="${incident ? 'status-problem' : 'status-ok'} px-5 py-2 rounded-3xl font-bold text-sm min-w-[120px] text-center">
                            ${incident ? 'INCIDENCIA' : 'ESTABLE'}
                        </div>

                        ${incident ? buildTimerHTML(channel) : ''}
                    </div>

                    <button type="button"
                            onclick='deleteChannel(${idArg})'
                            class="ml-1 text-xl text-slate-500 hover:text-red-400"
                            title="Eliminar del monitor">
                        ✕
                    </button>
                </div>
            </div>
        `;

        return card;
    }

    async function setManualState(id, field, value) {
        if (operationInProgress) return;
        operationInProgress = true;

        const channel = channels.find(
            item => String(item.id) === String(id)
        );

        if (!channel) {
            operationInProgress = false;
            return;
        }

        const previousImage = channel.image;
        const previousSound = channel.sound;

        const nextImage =
            field === 'image'
                ? value
                : channel.image;

        const nextSound =
            field === 'sound'
                ? value
                : channel.sound;

        const wasProblem = !previousImage || !previousSound;
        const willBeProblem = !nextImage || !nextSound;

        const fields = {
            [field]: value
        };

        if (!wasProblem && willBeProblem) {
            fields.incident_open = true;
            fields.incident_since = new Date().toISOString();
            fields.incident_origin = 'noc';
        }

        if (wasProblem && !willBeProblem) {
            fields.incident_open = false;
            fields.incident_since = null;
            fields.incident_origin = null;
        }

        const success = await updateChannelInDB(
            channel.id,
            fields
        );

        if (!success) {
            alert('No se pudo guardar el cambio.');
            operationInProgress = false;
            await safeReload();
            return;
        }

        Object.assign(channel, fields);
        renderChannels();

        operationInProgress = false;
    }

    function updateImage(id, checked) {
        return setManualState(id, 'image', checked);
    }

    function updateSound(id, checked) {
        return setManualState(id, 'sound', checked);
    }

    async function addChannel() {
        const numberInput = document.getElementById('channel-number');
        const nameInput = document.getElementById('channel-name');

        const number = numberInput.value.trim();
        const name = nameInput.value.trim();

        if (!number || !name) {
            alert('Completa el número y el nombre del canal.');
            return;
        }

        const duplicated = channels.some(
            channel => String(channel.number).trim() === number
        );

        if (duplicated) {
            alert('Ese número de canal ya existe.');
            return;
        }

        const { error } = await sb
            .from('GPONTV')
            .insert({
                number,
                name,
                image: true,
                sound: true,
                incident_open: false,
                incident_since: null,
                incident_origin: null
            });

        if (error) {
            console.error(error);
            alert(`No se pudo agregar el canal.\n\n${error.message}`);
            return;
        }

        numberInput.value = '';
        nameInput.value = '';

        await safeReload();
    }

    async function deleteChannel(id) {
        const channel = channels.find(
            item => String(item.id) === String(id)
        );

        if (!channel) return;

        const ok = confirm(
            `¿Eliminar el canal ${channel.number} – ${channel.name}?`
        );

        if (!ok) return;

        const { error } = await sb
            .from('GPONTV')
            .delete()
            .eq('id', channel.id);

        if (error) {
            console.error(error);
            alert(`No se pudo eliminar el canal.\n\n${error.message}`);
            return;
        }

        channels = channels.filter(
            item => String(item.id) !== String(channel.id)
        );

        renderChannels();
    }

    async function resetAllStates() {
        const affected = channels.filter(hasProblem);

        if (!affected.length) {
            alert('Todos los canales ya están estables.');
            return;
        }

        const ok = confirm(
            `¿Restablecer IMAGEN y AUDIO en ${affected.length} canal(es)?`
        );

        if (!ok) return;

        const { error } = await sb
            .from('GPONTV')
            .update({
                image: true,
                sound: true,
                incident_open: false,
                incident_since: null,
                incident_origin: null
            })
            .in(
                'id',
                affected.map(channel => channel.id)
            );

        if (error) {
            console.error(error);
            alert(`No se pudieron reiniciar los estados.\n\n${error.message}`);
            return;
        }

        affected.forEach(channel => {
            channel.image = true;
            channel.sound = true;
            channel.incident_open = false;
            channel.incident_since = null;
            channel.incident_origin = null;
        });

        renderChannels();
    }

    function togglePanel() {
        panelOpen = !panelOpen;

        const form = document.getElementById('form-container');
        const icon = document.getElementById('form-icon');

        form.style.display = panelOpen ? 'block' : 'none';
        icon.textContent = panelOpen ? '▲' : '▼';

        localStorage.setItem(
            'gpontv_manual_panel_open_v1',
            String(panelOpen)
        );
    }

    function updateSearch(value) {
        searchQuery = String(value || '')
            .trim()
            .toLowerCase();

        const clear = document.getElementById('search-clear-btn');
        clear.classList.toggle('visible', Boolean(searchQuery));

        renderChannels();
    }

    function clearSearch() {
        const input = document.getElementById('search-input');
        input.value = '';
        searchQuery = '';
        document
            .getElementById('search-clear-btn')
            .classList.remove('visible');
        renderChannels();
    }

    function toggleFilter() {
        filterOnlyIncidents = !filterOnlyIncidents;
        updateFilterButton();
        renderChannels();
    }

    function updateFilterButton() {
        setText(
            'filter-text',
            filterOnlyIncidents
                ? 'VER TODOS'
                : 'FILTRAR INCIDENCIAS'
        );

        setText(
            'filter-icon',
            filterOnlyIncidents
                ? '📺'
                : '🔴'
        );
    }

    function copyIncidentReport() {
        const problemChannels = channels.filter(hasProblem);

        if (!problemChannels.length) {
            alert('No hay incidencias activas para reportar.');
            return;
        }

        const now = nowLima();
        const pad = value => String(value).padStart(2, '0');

        const lines = [
            '🚨 REPORTE DE CANALES CON INCIDENCIAS 🚨',
            'LIMA / CUSCO / ICA',
            `Fecha: ${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
            `Incidencias detectadas: ${problemChannels.length}`,
            ''
        ];

        problemChannels.forEach(channel => {
            const issues = [];

            if (!channel.image) issues.push('Sin Imagen');
            if (!channel.sound) issues.push('Sin Audio');

            const duration = incidentDuration(channel);

            lines.push(
                `CANAL ${channel.number} – ${String(channel.name).toUpperCase()} ` +
                `(${issues.join(', ')})${duration ? ` - ${duration}` : ''}`
            );
        });

        const report = lines.join('\n');

        const copied = () => {
            setText('copy-btn-icon', '✅');
            setText('copy-btn-text', 'COPIADO');

            setTimeout(() => {
                setText('copy-btn-icon', '📋');
                setText('copy-btn-text', 'COPIAR');
            }, 1400);
        };

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard
                .writeText(report)
                .then(copied)
                .catch(() => fallbackCopy(report, copied));
        } else {
            fallbackCopy(report, copied);
        }
    }

    function fallbackCopy(text, callback) {
        const area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';

        document.body.appendChild(area);
        area.select();

        try {
            document.execCommand('copy');
            callback();
        } catch {
            alert('No se pudo copiar automáticamente.');
        }

        area.remove();
    }

    function exportData() {
        const rows = [
            ['number', 'name', 'image', 'sound'],
            ...channels.map(channel => [
                channel.number,
                channel.name,
                channel.image,
                channel.sound
            ])
        ];

        const csv = rows
            .map(row => row.map(csvEscape).join(','))
            .join('\n');

        const blob = new Blob(
            [csv],
            { type: 'text/csv;charset=utf-8' }
        );

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');

        a.href = url;
        a.download = `gpon_tv_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();

        URL.revokeObjectURL(url);
    }

    function csvEscape(value) {
        const text = String(value ?? '');

        if (/[",\n]/.test(text)) {
            return `"${text.replaceAll('"', '""')}"`;
        }

        return text;
    }

    function parseCSV(text) {
        const rows = [];
        let row = [];
        let cell = '';
        let quoted = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];

            if (char === '"') {
                if (quoted && text[i + 1] === '"') {
                    cell += '"';
                    i++;
                } else {
                    quoted = !quoted;
                }
            } else if (char === ',' && !quoted) {
                row.push(cell);
                cell = '';
            } else if ((char === '\n' || char === '\r') && !quoted) {
                if (char === '\r' && text[i + 1] === '\n') i++;

                row.push(cell);

                if (row.some(value => value.trim() !== '')) {
                    rows.push(row);
                }

                row = [];
                cell = '';
            } else {
                cell += char;
            }
        }

        row.push(cell);

        if (row.some(value => value.trim() !== '')) {
            rows.push(row);
        }

        return rows;
    }

    async function importCSV(input) {
        const file = input.files?.[0];
        if (!file) return;

        try {
            const text = await file.text();
            const rows = parseCSV(text);

            if (rows.length < 2) {
                alert('El CSV está vacío o no tiene datos.');
                return;
            }

            const headers = rows[0].map(
                value => value.trim().toLowerCase()
            );

            const numberIndex = headers.indexOf('number');
            const nameIndex = headers.indexOf('name');
            const imageIndex = headers.indexOf('image');
            const soundIndex = headers.indexOf('sound');

            if (numberIndex < 0 || nameIndex < 0) {
                alert('El CSV debe contener al menos number y name.');
                return;
            }

            const payload = rows.slice(1)
                .map(row => ({
                    number: String(row[numberIndex] ?? '').trim(),
                    name: String(row[nameIndex] ?? '').trim(),
                    image:
                        imageIndex < 0
                            ? true
                            : String(row[imageIndex]).toLowerCase() !== 'false',
                    sound:
                        soundIndex < 0
                            ? true
                            : String(row[soundIndex]).toLowerCase() !== 'false'
                }))
                .filter(row => row.number && row.name);

            if (!payload.length) {
                alert('No se encontraron canales válidos.');
                return;
            }

            const { error } = await sb
                .from('GPONTV')
                .upsert(
                    payload,
                    { onConflict: 'number' }
                );

            if (error) throw error;

            await safeReload();
            alert(`${payload.length} canal(es) importados.`);
        } catch (error) {
            console.error(error);
            alert(`No se pudo importar el CSV.\n\n${error.message || error}`);
        } finally {
            input.value = '';
        }
    }

    async function safeReload() {
        try {
            await loadChannels();
            renderChannels();
        } catch (error) {
            console.error(error);
            alert(`No se pudieron cargar los canales.\n\n${error.message || error}`);
        }
    }

    function subscribeRealtime() {
        if (realtimeChannel) {
            sb.removeChannel(realtimeChannel);
        }

        realtimeChannel = sb
            .channel('gpontv-manual-monitor')
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'GPONTV'
                },
                async payload => {
                    if (payload.eventType === 'DELETE') {
                        channels = channels.filter(
                            channel =>
                                String(channel.id) !==
                                String(payload.old?.id)
                        );
                    } else {
                        const incoming = mapRowToChannel(payload.new);
                        const index = channels.findIndex(
                            channel =>
                                String(channel.id) ===
                                String(incoming.id)
                        );

                        if (index >= 0) {
                            channels[index] = incoming;
                        } else {
                            channels.push(incoming);
                        }
                    }

                    renderChannels();
                }
            )
            .subscribe(status => {
                const dot = document.getElementById('realtime-dot');
                const label = document.getElementById('realtime-label');

                if (status === 'SUBSCRIBED') {
                    dot.className =
                        'w-2 h-2 rounded-full bg-green-500';
                    label.textContent = 'EN LÍNEA';
                } else if (
                    status === 'CHANNEL_ERROR' ||
                    status === 'TIMED_OUT'
                ) {
                    dot.className =
                        'w-2 h-2 rounded-full bg-red-500';
                    label.textContent = 'ERROR';
                } else {
                    dot.className =
                        'w-2 h-2 rounded-full bg-yellow-400';
                    label.textContent = 'CONECTANDO…';
                }
            });
    }

    function refreshTimers() {
        document
            .querySelectorAll('[data-timer-id]')
            .forEach(node => {
                const id = node.getAttribute('data-timer-id');
                const channel = channels.find(
                    item => String(item.id) === String(id)
                );

                if (!channel || !hasProblem(channel)) return;

                const duration = incidentDuration(channel);
                node.innerHTML =
                    `<span class="dot"></span>${escapeHTML(duration)}`;
            });
    }

    async function init() {
        updateClock();
        setInterval(updateClock, 1000);
        setInterval(refreshTimers, 30000);

        panelOpen =
            localStorage.getItem('gpontv_manual_panel_open_v1') === 'true';

        const form = document.getElementById('form-container');
        const icon = document.getElementById('form-icon');

        form.style.display = panelOpen ? 'block' : 'none';
        icon.textContent = panelOpen ? '▲' : '▼';

        try {
            await loadChannels();
            renderChannels();
            subscribeRealtime();
        } catch (error) {
            console.error(error);

            alert(
                'No se pudo cargar GPON TV.\n\n' +
                (error.message || String(error))
            );
        } finally {
            document
                .getElementById('loading-overlay')
                .classList.add('hidden');
        }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
